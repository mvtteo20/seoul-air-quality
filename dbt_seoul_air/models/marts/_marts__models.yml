version: 2

models:
  - name: dim_stations
    description: "One row per OpenAQ station, with its latest known name and coordinates."
    columns:
      - name: station_id
        data_tests:
          - unique
          - not_null
  - name: fct_measurements
    description: "One row per distinct measurement of a station, pollutant and unit, deduplicated across extractions."
    columns:
      - name: measurement_key
        data_tests:
          - unique
          - not_null
      - name: station_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_id
      - name: pollutant_code
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['co', 'no2', 'o3', 'so2', 'pm10', 'pm25']
      - name: unit
        data_tests:
          - not_null
      - name: measurement_value
        data_tests:
          - not_null
      - name: measurement_at
        data_tests:
          - not_null     
  - name: rpt_latest_measurements
    description: "Latest measurement per station and pollutant, with coordinates, built for the dashboard."
    columns:
      - name: station_id
        data_tests:
          - not_null
      - name: pollutant_code
        data_tests:
          - not_null
      - name: location
        data_tests:
          - not_null  