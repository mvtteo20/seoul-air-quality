version: 2

models:
  - name: dim_stations
    description: "One row per OpenAQ station, with its latest known name and coordinates."
    columns:
      - name: station_id
        data_tests:
          - unique
          - not_null
  - name: fct_measurements
    description: "One row per distinct measurement of a station, pollutant and unit, deduplicated across extractions."
    columns:
      - name: measurement_key
        data_tests:
          - unique
          - not_null
      - name: station_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stations')
                field: station_id       