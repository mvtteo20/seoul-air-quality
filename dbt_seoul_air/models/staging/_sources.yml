version: 2

sources:
    - name: openaq
      database: seoul-air-quality
      schema: seoul_air_quality_raw
      tables:
        - name: air_quality_measurements
          config :
            loaded_at_field: "cast(datetime_utc as timestamp)"
            freshness:
              warn_after: {count: 36, period: hour}
              error_after: {count: 72, period: hour}




    